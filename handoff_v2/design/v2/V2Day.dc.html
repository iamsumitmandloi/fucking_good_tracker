<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F169}a:hover{color:#E2FFA6}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1012; color: #EDEEF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex-grow: 1; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">

<div style="display: flex; align-items: center; justify-content: space-between">
<button onClick="{{prev}}" aria-label="Previous day" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2F36; background: #171A1E; color: #EDEEF0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"></path></svg></button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">{{day.label}}</h1>
<div style="font-size: 12px; color: #A3AAB4">Read-only · synced from Events 01:58</div>
</div>
<button onClick="{{next}}" aria-label="Next day" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2F36; background: #171A1E; color: #EDEEF0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #171A1E; border: 1px solid #2A2F36; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A3AAB4"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{k.color}}"></span>{{k.label}}</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.15">{{k.value}}</div>
<div style="font-size: 11px; color: #A3AAB4">{{k.delta}}</div>
</div>
</sc-for>
</div>

<div style="background: #171A1E; border: 1px solid #2A2F36; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 14px; font-weight: 600">Your day, 00:00 → 24:00</div>
<div style="font-size: 11px; color: #7D858F">tap a mark</div>
</div>
<div style="display: flex; padding-left: 50px; justify-content: space-between; font-size: 10px; color: #7D858F; width: 322px">
<span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>

<div style="display: flex; align-items: center; height: 22px">
<div style="width: 50px; font-size: 11px; color: #A3AAB4">Sleep</div>
<div style="position: relative; width: 272px; height: 14px; border-radius: 4px; background: #1F2329">
<sc-for list="{{sleepBars}}" as="b" hint-placeholder-count="1"><div style="position: absolute; top: 0; height: 14px; border-radius: 4px; background: #3987e5; left: {{b.left}}; width: {{b.width}}"></div></sc-for>
</div></div>

<div style="display: flex; align-items: center; height: 22px">
<div style="width: 50px; font-size: 11px; color: #A3AAB4">Bus</div>
<div style="position: relative; width: 272px; height: 14px; border-radius: 4px; background: #1F2329">
<sc-for list="{{busBars}}" as="b" hint-placeholder-count="2"><button onClick="{{b.pick}}" aria-label="{{b.aria}}" style="position: absolute; top: -6px; height: 26px; padding: 0; border: none; background: transparent; left: {{b.left}}; width: {{b.width}}"><span style="display: block; margin-top: 6px; height: 14px; border-radius: 4px; background: #5D646E"></span></button></sc-for>
</div></div>

<div style="display: flex; align-items: center; height: 30px">
<div style="width: 50px; font-size: 11px; color: #A3AAB4">Smoke</div>
<div style="position: relative; width: 272px; height: 22px; border-bottom: 1px solid #2A2F36">
<sc-for list="{{smokeMarks}}" as="s" hint-placeholder-count="5"><button onClick="{{s.pick}}" aria-label="{{s.aria}}" style="position: absolute; bottom: 0; width: 24px; height: 30px; padding: 0; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1px; left: {{s.left}}"><span style="font-size: 9px; color: #C4C9D0; line-height: 1">{{s.count}}</span><span style="width: 5px; border-radius: 3px 3px 0 0; background: #d95926; height: {{s.h}}"></span></button></sc-for>
</div></div>

<div style="display: flex; align-items: center; height: 26px">
<div style="width: 50px; font-size: 11px; color: #A3AAB4">Food</div>
<div style="position: relative; width: 272px; height: 22px">
<sc-for list="{{foodMarks}}" as="f" hint-placeholder-count="4"><button onClick="{{f.pick}}" aria-label="{{f.aria}}" style="position: absolute; top: 0; width: 22px; height: 22px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; left: {{f.left}}"><span style="border-radius: 50%; background: #199e70; border: 2px solid #171A1E; width: {{f.size}}; height: {{f.size}}"></span></button></sc-for>
</div></div>

<div style="display: flex; align-items: center; height: 30px">
<div style="width: 50px; font-size: 11px; color: #A3AAB4">₹ spent</div>
<div style="position: relative; width: 272px; height: 26px">
<sc-for list="{{moneyMarks}}" as="mk" hint-placeholder-count="4"><button onClick="{{mk.pick}}" aria-label="{{mk.aria}}" style="position: absolute; top: 0; width: 26px; height: 26px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; left: {{mk.left}}"><span style="border-radius: 50%; background: #c98500; border: 2px solid #171A1E; width: {{mk.size}}; height: {{mk.size}}"></span></button></sc-for>
</div></div>

<div style="margin-top: 2px; background: #1F2329; border-radius: 10px; padding: 8px 10px; font-size: 13px; min-height: 18px">{{selText}}</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; color: #A3AAB4">Logged without a time</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-if value="{{hasUntimedCigs}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; padding: 5px 9px; border-radius: 8px; background: #2A1C10; border: 1px solid #5A3A1E; color: #F1C7A8">{{untimedCigText}}</span></sc-if>
<sc-for list="{{untimed}}" as="u" hint-placeholder-count="4"><span style="font-size: 12px; padding: 5px 9px; border-radius: 8px; background: #1F2329; border: 1px solid #2A2F36; color: #C4C9D0">{{u}}</span></sc-for>
</div>
</div>

<div style="background: #171A1E; border: 1px solid #2A2F36; border-radius: 16px; padding: 4px 12px; display: flex; flex-direction: column; overflow: hidden; min-height: 0">
<sc-for list="{{entries}}" as="e" hint-placeholder-count="5">
<div style="display: flex; gap: 10px; align-items: center; min-height: 30px; border-bottom: 1px solid #22262C; font-size: 13px">
<span style="width: 40px; color: #7D858F; font-variant-numeric: tabular-nums">{{e.t}}</span>
<span style="width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; background: {{e.color}}"></span>
<span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.text}}</span>
<span style="color: #A3AAB4">{{e.amt}}</span>
</div>
</sc-for>
<div style="font-size: 12px; color: #A3AAB4; padding: 7px 0">{{moreText}}</div>
</div>
</div>
<nav aria-label="Main" style="height: 72px; border-top: 1px solid #22262C; background: #0E1012; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 6px; flex-shrink: 0">
<a href="V2Day.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navDay}}; text-decoration: none; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Day</a>
<a href="V2Week.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navWeek}}; text-decoration: none; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>Week</a>
<a href="V2Smoking.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navTrends}}; text-decoration: none; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Trends</a>
<a href="V2Money.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navMoney}}; text-decoration: none; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12M6 9h12M6 4h3a5 5 0 0 1 0 10H6l8 6"></path></svg>Money</a>
<a href="V2Insights.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navInsights}}; text-decoration: none; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"></path></svg>Insights</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  px(min) { return Math.round(min / 1440 * 272); }
  hm(min) { const h = Math.floor(min / 60), m = min % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }
  dur(min) { const h = Math.floor(min / 60), m = min % 60; return h + 'h ' + String(m).padStart(2, '0') + 'm'; }
  rupee(n) { return '\u20b9' + Math.round(n).toLocaleString('en-IN'); }
  constructor(props) { super(props); this.state = { idx: 6, sel: '' }; }
  renderVals() {
    const s = this.state;
    const DAYS = this.days();
    const AVG = { cigs: 7.14, sleep: 6.46, spend: 980, commute: 156 };
    const px = (x) => this.px(x), hm = (x) => this.hm(x), dur = (x) => this.dur(x), rupee = (x) => this.rupee(x);
    const d = DAYS[s.idx];
    const st = d.stats;
    const pick = (text) => () => this.setState({ sel: text });
    const cigDelta = st.cigs - AVG.cigs;
    const kpis = [
      { label: 'Cigarettes', color: '#d95926', value: String(st.cigs), delta: (cigDelta <= 0 ? '▼ ' : '▲ ') + Math.abs(cigDelta).toFixed(1) + ' vs 7-day avg 7.1' },
      { label: 'Slept (night before)', color: '#3987e5', value: st.sleepH == null ? '—' : '~' + st.sleepH + ' h', delta: st.sleepH == null ? 'not logged' : ((st.sleepH - AVG.sleep >= 0 ? '▲ ' : '▼ ') + Math.abs(st.sleepH - AVG.sleep).toFixed(1) + ' h vs avg 6.5') },
      { label: 'Day-to-day spend', color: '#c98500', value: rupee(st.spend), delta: (st.spend <= AVG.spend ? rupee(AVG.spend - st.spend) + ' under' : rupee(st.spend - AVG.spend) + ' over') + ' avg ₹980' + (st.oneoff ? ' · +' + rupee(st.oneoff) + ' one-off' : '') },
      { label: 'Commute', color: '#5D646E', value: st.commute ? dur(st.commute) : 'Off day', delta: st.commute ? ((st.commute - AVG.commute >= 0 ? '▲ ' : '▼ ') + Math.abs(st.commute - AVG.commute) + ' min vs office avg') : 'no bus legs' }
    ];
    const sleepBars = d.sleep.map((b) => ({ left: px(b[0]) + 'px', width: Math.max(4, px(b[1]) - px(b[0])) + 'px' }));
    const busBars = d.bus.map((b) => ({ left: px(b[0]) + 'px', width: Math.max(6, px(b[1]) - px(b[0])) + 'px', aria: 'Bus ' + hm(b[0]) + ' to ' + hm(b[1]), pick: pick('Bus ' + hm(b[0]) + ' → ' + hm(b[1]) + ' · ' + (b[1] - b[0]) + ' min') }));
    const smokeMarks = d.smoke.map((m) => ({ left: (px(m[0]) - 12) + 'px', count: m[1] > 1 ? String(m[1]) : '', h: (8 + m[1] * 5) + 'px', aria: m[1] + ' cigarette at ' + hm(m[0]), pick: pick(hm(m[0]) + ' · ' + m[1] + ' cigarette' + (m[1] > 1 ? 's' : '')) }));
    const foodMarks = d.food.map((f) => ({ left: (px(f[0]) - 11) + 'px', size: (f[1] === 'meal' ? 12 : 8) + 'px', aria: f[2] + ' at ' + hm(f[0]), pick: pick(hm(f[0]) + ' · ' + f[2]) }));
    const moneyMarks = d.money.map((m) => ({ left: (px(m[0]) - 13) + 'px', size: Math.round(6 + Math.min(14, Math.sqrt(m[1]) / 2)) + 'px', aria: rupee(m[1]) + ' at ' + hm(m[0]), pick: pick(hm(m[0]) + ' · ' + rupee(m[1]) + ' · ' + m[2]) }));
    const untimedCigs = st.cigs - st.cigsTimed;
    const untimed = d.untimed.map((u) => u[1] ? u[1] : u[0]);
    const rows = [];
    d.smoke.forEach((m) => rows.push({ k: m[0], t: hm(m[0]), color: '#d95926', text: m[1] + ' cigarette' + (m[1] > 1 ? 's' : ''), amt: '' }));
    d.food.forEach((f) => rows.push({ k: f[0], t: hm(f[0]), color: '#199e70', text: f[2], amt: '' }));
    d.money.forEach((m) => rows.push({ k: m[0] + 0.5, t: hm(m[0]), color: '#c98500', text: m[2], amt: rupee(m[1]) }));
    d.bus.forEach((b) => rows.push({ k: b[0], t: hm(b[0]), color: '#5D646E', text: 'Bus → ' + hm(b[1]) + ' (' + (b[1] - b[0]) + ' min)', amt: '' }));
    rows.sort((a, b) => a.k - b.k);
    const shown = rows.slice(0, 6);
    return {
      day: d, kpis, sleepBars, busBars, smokeMarks, foodMarks, moneyMarks,
      selText: s.sel || 'Tap any mark on the ribbon to see what and when.',
      hasUntimedCigs: untimedCigs > 0,
      untimedCigText: untimedCigs + ' cigarette' + (untimedCigs > 1 ? 's' : '') + ' with no time',
      untimed, entries: shown,
      moreText: rows.length > 6 ? '+' + (rows.length - 6) + ' more timed entries' : (rows.length ? 'All timed entries shown' : 'No timed entries this day'),
      prev: () => this.setState({ idx: Math.max(0, s.idx - 1), sel: '' }),
      next: () => this.setState({ idx: Math.min(DAYS.length - 1, s.idx + 1), sel: '' }),
      navDay: '#C8F169', navWeek: '#A3AAB4', navTrends: '#A3AAB4', navMoney: '#A3AAB4', navInsights: '#A3AAB4'
    };
  }
}
</script>
